<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IB Biology Qbank · Tutlix</title>
<meta name="description" content="IB Biology question bank for the current syllabus (first exams 2025): exam-style Paper 1 multiple choice, data-based and Paper 2 questions for every topic, SL and HL, with instant feedback and full markschemes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--paper:#F3E6D6;--grid:rgba(42,42,46,.07);--ink:#2A2A2E;--card:#FFFDF8;--muted:#57525C;--bio:#FBDF4A;--chem:#3D55F5;--phys:#F25C84;--math:#22D3A5;--ok:#C9F3E6;--bad:#FFD6DE;
 --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,'Courier New',monospace;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:17px;line-height:1.5;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:inherit}
button{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--chem);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.1}
.wrap{max-width:1160px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 64px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:20px 22px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--bio);color:var(--ink);font:800 16px var(--display);box-shadow:4px 4px 0 var(--ink);cursor:pointer;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--card)}.btn.small{min-height:38px;padding:5px 14px;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:3px solid var(--ink);box-shadow:0 4px 0 rgba(42,42,46,.12)}
.topbar .in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-left,0px))}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 24px var(--display)}
.tb-nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tb-nav a{font:700 15px var(--display);text-decoration:none;padding:8px 12px;border-radius:10px;border:2px solid transparent;min-height:44px;display:inline-flex;align-items:center}
.tb-nav a:hover{border-color:var(--ink);background:var(--paper)}.tb-nav a.on{border-color:var(--ink);background:var(--bio)}
@media (max-width:560px){.tb-nav a.hide-s{display:none}.tb-brand span.t{display:none}}
.hero{background:var(--bio)}
.hero h1{font-size:clamp(36px,9vw,54px);font-weight:800;margin:6px 0 8px}
.hero p{margin:0;font-family:var(--mono);font-size:15px}
.crumbs{font-family:var(--mono);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:12px 14px;box-shadow:3px 3px 0 var(--ink)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}.stat span{font:400 12px var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 14px var(--mono);border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:6px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.builder{display:grid;gap:14px}
.builder .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.builder .row>span{font:700 13px var(--mono);min-width:92px}
.theme h3{font-size:19px;font-weight:800;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.theme h3 small{font:400 13px var(--mono);color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media (min-width:980px){.tlist{grid-template-columns:1fr 1fr}}
.titem{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--card);text-decoration:none}
.titem:hover{background:#FFF6D6}
.titem .code{font:700 13px var(--mono)}
.titem .nm{font-weight:700}
.titem .meta{font:400 12px var(--mono);color:var(--muted);display:block}
.bar{display:block;position:relative;height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;margin:8px 10px 2px 0;max-width:320px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22D3A5,#3D55F5);border-radius:99px;transition:width .6s ease}
.bar b{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:2.5px solid var(--ink);border-radius:50%;background:var(--bio);box-shadow:1px 2px 0 var(--ink);transition:left .6s ease}
.hl{font:700 11px var(--mono);border:2px solid var(--ink);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;background:var(--phys)}
.go{font:700 13px var(--mono);border:2px solid var(--ink);border-radius:10px;padding:6px 12px;background:var(--bio);box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
/* practice */
.qhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qhead h2{font-size:24px;font-weight:800}
.pbar{height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--chem);transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border:2px solid var(--ink);border-radius:9px;background:var(--card);font:700 12px var(--mono);cursor:pointer;display:grid;place-items:center}
.dot.cur{outline:3px solid var(--chem);outline-offset:1px}.dot.ok{background:var(--math)}.dot.bad{background:var(--phys)}.dot.part{background:var(--bio)}.dot.ans{background:#DDE2FF}
.qcard{display:grid;gap:14px}
.qtag{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:700 11px var(--mono);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#fff}
.qtext{font-size:18px;font-weight:600;margin:0}
.qtext p{margin:0 0 8px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;text-align:left;font:600 16px var(--display);background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:54px;color:var(--ink)}
.opt .k{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:700 14px var(--mono);background:var(--card)}
.opt:hover:not(:disabled){background:#FFF6D6}
.opt.sel{background:#DDE2FF}.opt.ok{background:var(--ok);border-color:#159E7B}.opt.bad{background:var(--bad);border-color:#C8202F}
.opt:disabled{cursor:default}
.expl{border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px;background:#F6F2FF;font-size:16px}
.expl b{font-family:var(--mono)}
.fig{overflow-x:auto}
.fig svg{display:block;margin:0 auto}
table.dt{border-collapse:collapse;margin:0 auto;font:14px var(--mono);background:#fff}
table.dt th,table.dt td{border:1.5px solid var(--ink);padding:6px 10px;text-align:center}
table.dt th{background:var(--bio)}
.part{border:2px dashed var(--ink);border-radius:12px;padding:12px;display:grid;gap:10px;background:#fff}
.part .pq{font-weight:600;margin:0}
textarea{font:16px var(--mono);border:2px solid var(--ink);border-radius:10px;padding:10px;min-height:84px;width:100%;resize:vertical;background:#fff;color:var(--ink)}
.ms{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ms label{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:15px;cursor:pointer;border:2px solid #E5DCCB;border-radius:10px;padding:8px 10px;background:#FFFDF6}
.ms input{width:20px;height:20px;margin:2px 0 0;accent-color:#159E7B}
.ms label.aiok{border-color:#159E7B;background:#E3F8EF}
.aifb{border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;background:linear-gradient(135deg,#EEF0FF,#F6F2FF);font-size:15px;display:grid;gap:4px}
.aifb .sc{font:800 15px var(--mono)}
.aibar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ainote{font-size:14px;color:var(--muted);margin:0}
.btn.ai{background:linear-gradient(135deg,#C8B6FF,#9FB4FF)}
.btn[disabled]{opacity:.6;cursor:wait}
.mscore{font:700 14px var(--mono)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.streak{font:700 14px var(--mono);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;background:#FFE2C2}
.timer{font:700 16px var(--mono);border:2px solid var(--ink);border-radius:10px;padding:4px 12px;background:#fff}
.timer.low{background:var(--phys)}
.lockcard{background:repeating-linear-gradient(135deg,#FFFDF8 0 14px,#FFF3D1 14px 28px)}
.lockrow{display:flex;gap:8px;flex-wrap:wrap}
.lockrow input{flex:1;min-width:170px;font:700 18px var(--mono);letter-spacing:2px;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;text-transform:uppercase}
.big{font-size:56px;font-weight:800;line-height:1}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rlist li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff;font-size:15px;cursor:pointer}
.rlist li .s{font:700 12px var(--mono);padding:2px 8px;border:2px solid var(--ink);border-radius:8px}
.burst{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.burst span{position:absolute;top:-30px;font-size:26px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
footer{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
@media (max-width:480px){.titem{grid-template-columns:50px 1fr}.titem .go{grid-column:2;justify-self:start}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

\" stroke=\"#2A2A2E\"/><text x=\"90\" y=\"48\" text-anchor=\"start\" font-family=\"Space Mono,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"#2A2A2E\">Water<\/text><rect x=\"131.0\" y=\"38\" width=\"12\" height=\"12\" fill=\"#E0476F\" stroke=\"#2A2A2E\"/><text x=\"147.0\" y=\"48\" text-anchor=\"start\" font-family=\"Space Mono,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"#2A2A2E\">Ethanol<\/text><\/svg>", "parts": [{"q": "Calculate the rate of temperature increase of water, in °C per minute.", "m": 1, "ms": ["(40 − 20) ÷ 5 = 4 °C min⁻¹"]}, {"q": "Compare the temperature change of the two liquids.", "m": 2, "ms": ["Both start at 20 °C / both increase linearly", "Ethanol rises faster / 2.5 times faster / ethanol 10 °C min⁻¹ vs water 4 °C min⁻¹", "Ethanol reaches 70 °C, water only 40 °C after 5 min"]}, {"q": "Explain why the temperature of water rises more slowly.", "m": 2, "ms": ["Water has a high specific heat capacity", "Energy is needed to break hydrogen bonds between water molecules before the molecules move faster / temperature rises"]}], "hl": 0, "id": "A1.1-4", "top": "A1.1", "n": 4}, {"t": "m", "q": "Why is the high specific heat capacity of water important for aquatic organisms?", "o": ["Water temperature stays relatively stable, providing a thermally stable habitat", "Water freezes from the bottom up, protecting organisms", "Water can dissolve oxygen more easily when it is warm", "Water is less dense than ice"], "a": 0, "e": "A large amount of energy is needed to change the temperature of water, so lakes and oceans change temperature slowly.", "hl": 0, "id": "A1.1-5", "top": "A1.1", "n": 5}, {"t": "m", "q": "Which substance is hydrophobic?", "o": ["Triglyceride (fat)", "Glucose", "Sodium chloride", "Amino acids such as serine"], "a": 0, "e": "Triglycerides are non-polar, so they cannot form hydrogen bonds with water and do not dissolve.", "hl": 0, "id": "A1.1-6", "top": "A1.1", "n": 6}, {"t": "m", "q": "Sweating cools the body. Which property of water is responsible?", "o": ["Evaporation uses a lot of heat energy (high latent heat of vaporization)", "Water has a high density", "Water is transparent", "Water molecules are cohesive so sweat stays on the skin"], "a": 0, "e": "Breaking the hydrogen bonds to evaporate water requires a lot of energy, which is taken from the skin.", "hl": 0, "id": "A1.1-7", "top": "A1.1", "n": 7}, {"t": "m", "q": "Seals and penguins can float easily and move through water. Which comparison between water and air is correct?", "o": ["Water is more buoyant and more viscous than air", "Water is less buoyant and less viscous than air", "Water has a lower thermal conductivity than air", "Water has a lower specific heat capacity than air"], "a": 0, "e": "Water provides much more buoyancy but also more drag (viscosity). It also conducts heat better than air, which is why insulation (blubber) matters for marine mammals.", "hl": 0, "id": "A1.1-8", "top": "A1.1", "n": 8}, {"t": "m", "q": "Which hypothesis explains the origin of water on Earth?", "o": ["Water was delivered by asteroids and comets colliding with the early Earth", "Water formed by photosynthesis in the first cyanobacteria", "Water was produced by respiration in early animals", "Water condensed from the atmosphere of the Moon"], "a": 0, "e": "A leading hypothesis is that water-rich asteroids (and comets) delivered water; it was retained because Earth's distance from the Sun allows liquid water.", "hl": 1, "id": "A1.1-9", "top": "A1.1", "n": 9}, {"t": "m", "q": "Why do astrobiologists search for water when looking for life on other planets?", "o": ["Liquid water is needed as the medium for the chemical reactions of life as we know it", "Water is the only source of oxygen for respiration", "Water blocks all harmful radiation", "Water is always found where there is carbon dioxide"], "a": 0, "e": "Life on Earth depends on liquid water as a solvent. Planets in the 'Goldilocks zone' can have liquid water.", "hl": 1, "id": "A1.1-10", "top": "A1.1", "n": 10}, {"t": "s", "q": "Outline how hydrogen bonds form between water molecules.", "m": 3, "ms": ["Water molecules are polar / covalent bonds have unequal sharing of electrons", "Oxygen is slightly negative (δ−) and hydrogen slightly positive (δ+)", "Attraction between δ+ hydrogen of one molecule and δ− oxygen of another", "Hydrogen bonds are weak individually but strong in large numbers"], "hl": 0, "n": 11, "id": "A1.1-11", "top": "A1.1"}, {"t": "s", "q": "Explain how the properties of water allow it to act as a transport medium in organisms.", "m": 4, "ms": ["Water is a good solvent for polar/charged substances", "e.g. glucose, amino acids, ions dissolve in blood plasma / phloem sap", "Cohesion allows a continuous column of water in xylem", "Adhesion to xylem walls helps water rise / capillary action", "Hydrophobic substances (e.g. lipids, cholesterol) are transported in lipoproteins", "Oxygen has low solubility so it is carried by haemoglobin"], "hl": 0, "n": 12, "id": "A1.1-12", "top": "A1.1"}], "A1.2": [{"t": "m", "q": "Which components make up a single nucleotide?", "o": ["A pentose sugar, a phosphate group and a nitrogenous base", "A hexose sugar, a phosphate group and an amino acid", "A pentose sugar, a fatty acid and a nitrogenous base", "Two phosphate groups and a pentose sugar"], "a": 0, "e": "Nucleotides are the monomers of nucleic acids: sugar (ribose or deoxyribose) + phosphate + base.", "hl": 0, "id": "A1.2-1", "top": "A1.2", "n": 1}, {"t": "m", "q": "Which feature is found in RNA but not in DNA?", "o": ["Uracil", "Thymine", "Deoxyribose", "A double helix held by hydrogen bonds between strands"], "a": 0, "e": "RNA contains ribose and uracil and is usually single-stranded. DNA contains deoxyribose and thymine.", "hl": 0, "id": "A1.2-2", "top": "A1.2", "n": 2}, {"t": "m", "q": "A DNA sample contains 30% adenine. What percentage of the bases is cytosine?", "o": ["20%", "30%", "40%", "70%"], "a": 0, "e": "A = T = 30%, so A + T = 60%. G + C = 40%, and G = C, so C = 20%.", "hl": 0, "id": "A1.2-3", "top": "A1.2", "n": 3}, {"t": "d", "q": "Erwin Chargaff analysed the base composition of DNA from different organisms.", "fig": "<table class=\"dt\"><thead><tr><th>Organism<\/th><th>A %<\/th><th>G %<\/th><th>C %<\/th><th>T %<\/th><\/tr><\/thead><tbody><tr><td>Human<\/td><td>30.9<\/td><td>19.9<\/td><td>19.8<\/td><td>29.4<\/td><\/tr><tr><td>Wheat<\/td><td>27.3<\/td><td>22.7<\/td><td>22.8<\/td><td>27.1<\/td><\/tr><tr><td>E. coli<\/td><td>24.7<\/td><td>26.0<\/td><td>25.7<\/td><td>23.6<\/td><\/tr><tr><td>Sea urchin<\/td><td>32.8<\/td><td>17.7<\/td><td>17.3<\/td><td>32.1<\/td><\/tr><\/tbody><\/table>", "parts": [{"q": "Calculate the ratio A : T for sea urchin DNA (to two decimal places).", "m": 1, "ms": ["32.8 ÷ 32.1 = 1.02"]}, {"q": "State the relationship between the bases shown by the data.", "m": 1, "ms": ["Amount of A ≈ T and G ≈ C (in each organism)"]}, {"q": "Explain how this evidence supports the double helix model of DNA.", "m": 2, "ms": ["Bases pair complementarily: A with T, C with G", "One purine pairs with one pyrimidine, so the ratios are about 1 : 1 / helix has constant width"]}, {"q": "Suggest why the percentages are not exactly equal.", "m": 1, "ms": ["Experimental/measurement error / impurities in samples"]}], "hl": 0, "id": "A1.2-4", "top": "A1.2", "n": 4}, {"t": "m", "q": "How are nucleotides linked together to form a strand of DNA?", "o": ["Covalent bonds between the phosphate of one nucleotide and the sugar of the next", "Hydrogen bonds between the bases of adjacent nucleotides", "Ionic bonds between phosphate groups", "Peptide bonds between sugars"], "a": 0, "e": "A sugar–phosphate backbone forms by covalent (phosphodiester) bonds. Hydrogen bonds hold the two strands together.", "hl": 0, "id": "A1.2-5", "top": "A1.2", "n": 5}, {"t": "m", "q": "Why can DNA store a huge amount of information?", "o": ["The sequence of bases can vary in any order along a very long molecule", "DNA has 20 different types of nucleotide", "The sugar–phosphate backbone carries the code", "Each base can pair with any other base"], "a": 0, "e": "With 4 bases, there are 4ⁿ possible sequences for a length of n bases: practically limitless.", "hl": 0, "id": "A1.2-6", "top": "A1.2", "n": 6}, {"t": "m", "q": "Which pairing of bases is correct in DNA?", "o": ["Adenine with thymine, held by two hydrogen bonds", "Adenine with guanine, held by three hydrogen bonds", "Cytosine with thymine, held by two hydrogen bonds", "Guanine with uracil, held by three hydrogen bonds"], "a": 0, "e": "A=T has two hydrogen bonds; G≡C has three.", "hl": 0, "id": "A1.2-7", "top": "A1.2", "n": 7}, {"t": "m", "q": "What is meant by the antiparallel arrangement of DNA strands?", "o": ["The two strands run in opposite directions: one 5′→3′, the other 3′→5′", "The two strands have opposite charges", "One strand contains purines and the other pyrimidines", "The strands twist in opposite directions"], "a": 0, "e": "The 5′ end of one strand lies opposite the 3′ end of the other.", "hl": 1, "id": "A1.2-8", "top": "A1.2", "n": 8}, {"t": "m", "q": "In the Hershey–Chase experiment, bacteriophages labelled with ³⁵S were used to infect bacteria. Where was most of the radioactivity found after centrifugation?", "o": ["In the supernatant, because protein coats did not enter the bacteria", "In the pellet, because protein entered the bacteria", "In the bacterial DNA", "Equally in the pellet and supernatant"], "a": 0, "e": "Sulfur is in protein, not DNA. ³⁵S stayed outside with the empty phage coats; ³²P (in DNA) entered the bacteria and was found in the pellet, showing DNA is the genetic material.", "hl": 1, "id": "A1.2-9", "top": "A1.2", "n": 9}, {"t": "m", "q": "What is a nucleosome?", "o": ["DNA wrapped around a core of eight histone proteins", "A ribosome attached to mRNA", "A nucleotide with three phosphate groups", "The region of the nucleus where rRNA is made"], "a": 0, "e": "Nucleosomes help pack DNA in eukaryotic chromosomes and regulate access to genes.", "hl": 1, "id": "A1.2-10", "top": "A1.2", "n": 10}, {"t": "s", "q": "Distinguish between the structure of DNA and RNA.", "m": 3, "ms": ["DNA has deoxyribose, RNA has ribose", "DNA has thymine, RNA has uracil", "DNA is double-stranded, RNA (usually) single-stranded", "DNA forms a double helix; RNA does not / DNA is much longer"], "hl": 0, "n": 11, "id": "A1.2-11", "top": "A1.2"}, {"t": "s", "q": "Explain how the structure of DNA allows it to be replicated accurately.", "m": 3, "ms": ["Two strands can be separated (weak hydrogen bonds between bases)", "Each strand acts as a template", "Complementary base pairing: A–T, C–G", "So new strands have the same base sequence as the original (semi-conservative)"], "hl": 0, "n": 12, "id": "A1.2-12", "top": "A1.2"}], "A2.1": [{"t": "m", "q": "Which conditions on early Earth are thought to have allowed simple organic molecules to form?", "o": ["A reducing atmosphere with no free oxygen, high temperatures and lightning", "An oxygen-rich atmosphere and low temperatures", "An ozone layer that blocked all UV radiation", "Abundant enzymes in the oceans"], "a": 0, "e": "Pre-biotic Earth had little or no oxygen, with energy from lightning, UV and volcanic heat.", "hl": 0, "id": "A2.1-1", "top": "A2.1", "n": 1}, {"t": "m", "q": "What did the Miller–Urey experiment show?", "o": ["Amino acids can form from inorganic molecules under conditions like those on early Earth", "The first cells were prokaryotic", "DNA was the first genetic material", "Life came to Earth on meteorites"], "a": 0, "e": "Methane, ammonia, hydrogen and water exposed to electric sparks produced amino acids and other organic compounds.", "hl": 0, "id": "A2.1-2", "top": "A2.1", "n": 2}, {"t": "m", "q": "Why is RNA thought to have been the first genetic material?", "o": ["It can store information and also catalyse reactions as ribozymes", "It is more stable than DNA", "It is double-stranded", "It can only be made by enzymes"], "a": 0, "e": "RNA can self-replicate and act as a catalyst, solving the problem of needing both genes and enzymes.", "hl": 0, "id": "A2.1-3", "top": "A2.1", "n": 3}, {"t": "d", "q": "Researchers studied the formation of vesicles from fatty acids in water at different concentrations.", "fig": "<svg viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"Spontaneous vesicle formation\" style=\"width:100%;max-width:560px;background:#fff;border:2px solid #2A2A2E;border-radius:10px\"><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"12\" font-weight=\"700\" fill=\"#2A2A2E\">Spontaneous vesicle formation<\/text><line x1=\"64\" y1=\"248.0\" x2=\"540\" y2=\"248.0\" stroke=\"#E5E1D8\"/><text x=\"58\" y=\"252.0\" text-anchor=\"end\" font-family=\"Space Mono,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"#2A2A2E\">0<\/text><line x1=\"64\" y1=\"217.4\" x2=\"540\" y2=\"217.4\" stroke=\"#E5E1D8\"/><text x=\"58\" y=\"221.42857142857144\" text-anchor=\"end\" font-family=\"Space Mono,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"#2A2A2E\">10<\/text><line x1=\"64\" y1=\"186.9\" x2=\"540\" y2=\"186.9\" stroke=\"#E5E1D8\"/><text x=\"58\" y=\"190.85714285714286\" text-anchor=\"end\" font-family=\"Space Mono,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"#2A2A2E\">20<\/text><line x1=\"64\" y1=\"156.3\" x2=\"540\" y2=\"156.3\" stroke=\"#E5E1D8\"/><text x=\"58\" y=\"160.28571428571428\" text-anchor=\"end\" font-family=\"Space Mono,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"#2A2A2E\">30<\/text><line x1=\"64\" y1=\"125.7\" x2=\"540\" y2=\"125.7\" stroke=\"#E5E1D8\"/><text x=\"58\" y=\"129.71428571428572\" text-anchor=\"end\" font-family=\"Space Mono,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"#2A2A2E\">40<\/text><line x1=\"64\" y1=\"95.1\" x2=\"540\" y2=\"95.1\" stroke=\"#E5E1D8\"/><text x=\"58\" y=\"99.14285714285714\" text-anchor=\"end\" font-family=\"Space Mono,monospace\" font-size=\"10\" fo oke=\"#2A2A2E\"/><circle cx=\"143.3\" cy=\"248.0\" r=\"3.5\" fill=\"#3D55F5\" stroke=\"#2A2A2E\"/><circle cx=\"222.7\" cy=\"241.9\" r=\"3.5\" fill=\"#3D55F5\" stroke=\"#2A2A2E\"/><circle cx=\"302.0\" cy=\"202.1\" r=\"3.5\" fill=\"#3D55F5\" stroke=\"#2A2A2E\"/><circle cx=\"381.3\" cy=\"131.8\" r=\"3.5\" fill=\"#3D55F5\" stroke=\"#2A2A2E\"/><circle cx=\"460.7\" cy=\"89.0\" r=\"3.5\" fill=\"#3D55F5\" stroke=\"#2A2A2E\"/><circle cx=\"540.0\" cy=\"70.7\" r=\"3.5\" fill=\"#3D55F5\" stroke=\"#2A2A2E\"/><text x=\"302.0\" y=\"290\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#2A2A2E\">fatty acid concentration / mmol dm⁻³<\/text><text x=\"16\" y=\"141.0\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#2A2A2E\" transform=\"rotate(-90 16 141.0)\">vesicles per field of view<\/text><\/svg>", "parts": [{"q": "State the minimum concentration at which vesicles were observed.", "m": 1, "ms": ["20 mmol dm⁻³ (accept 15–20)"]}, {"q": "Describe the relationship between concentration and vesicle formation.", "m": 2, "ms": ["No vesicles below about 15–20 mmol dm⁻³", "Rapid increase between 20 and 50", "Levels off / plateau at about 55–60"]}, {"q": "Explain how fatty acids could form vesicles spontaneously.", "m": 2, "ms": ["Fatty acids are amphipathic / hydrophilic head and hydrophobic tail", "Hydrophobic tails face inwards, away from water, forming a bilayer / sphere"]}], "hl": 0, "id": "A2.1-4", "top": "A2.1", "n": 4}, {"t": "m", "q": "What is LUCA?", "o": ["The last universal common ancestor of all living organisms", "The first eukaryotic cell", "A type of ribozyme", "The earliest fossil of a multicellular organism"], "a": 0, "e": "All living organisms share features (genetic code, ribosomes, ATP) suggesting descent from one ancestral population.", "hl": 0, "id": "A2.1-5", "top": "A2.1", "n": 5}, {"t": "m", "q": "Which evidence supports the existence of LUCA?", "o": ["All organisms share the same genetic code and similar ribosomes", "All organisms have a nucleus", "All organisms photosynthesise", "All organisms are multicellular"], "a": 0, "e": "Universal features like the genetic code, ATP and conserved genes point to one common ancestor.", "hl": 0, "id": "A2.1-6", "top": "A2.1", "n": 6}, {"t": "m", "q": "Where might LUCA have lived?", "o": ["Near hydrothermal vents on the ocean floor", "On dry land in deserts", "In freshwater lakes rich in oxygen", "In the upper atmosphere"], "a": 0, "e": "Genes conserved across organisms suggest LUCA was adapted to hot, mineral-rich environments like hydrothermal vents.", "hl": 0, "id": "A2.1-7", "top": "A2.1", "n": 7}, {"t": "m", "q": "Which is a challenge for explaining the origin of cells?", "o": ["Explaining how a membrane enclosed a self-replicating molecule", "Explaining why cells contain water", "Explaining why cells divide by mitosis", "Explaining why cells need light"], "a": 0, "e": "Cells need catalysis, self-replication, self-assembly and compartmentalisation to arise together.", "hl": 0, "id": "A2.1-8", "top": "A2.1", "n": 8}, {"t": "m", "q": "Which approach is used to estimate when LUCA lived?", "o": ["Comparing rates of mutation in conserved genes (molecular clock) and fossil evidence", "Counting the cells in modern bacteria", "Measuring the temperature of hydrothermal vents", "Carbon-14 dating of DNA"], "a": 0, "e": "Molecular clocks and the oldest fossils/stromatolites (about 3.5 billion years) give estimates around 4 billion years ago.", "hl": 0, "id": "A2.1-9", "top": "A2.1", "n": 9}, {"t": "m", "q": "Which statement about spontaneous generation is correct?", "o": ["Pasteur's experiments showed that cells today only arise from pre-existing cells", "Pasteur showed that life arises from broth when air is excluded", "Spontaneous generation still occurs in hot springs", "Cells arise from viruses"], "a": 0, "e": "Swan-necked flask experiments showed no growth unless microbes entered, so cells come from existing cells.", "hl": 0, "id": "A2.1-10", "top": "A2.1", "n": 10}, {"t": "s", "q": "Outline the processes needed for the spontaneous origin of life on Earth.", "m": 4, "ms": ["Formation of simple organic molecules (e.g. amino acids) from inorganic ones", "Assembly of these into polymers (e.g. RNA, proteins)", "Formation of self-replicating molecules / RNA as genes and catalyst", "Packaging of molecules into membranes/vesicles", "Development of metabolism / catalysis"], "hl": 0, "n": 11, "id": "A2.1-11", "top": "A2.1"}, {"t": "s", "q": "Discuss the evidence for the RNA world hypothesis.", "m": 3, "ms": ["Ribozymes show RNA can act as a catalyst", "RNA can store genetic information", "Peptide bond formation in ribosomes is catalysed by rRNA", "But RNA is unstable / difficult to form under prebiotic conditions"], "hl": 0, "n": 12, "id": "A2.1-12", "top": "A2.1"}], "A2.2": [{"t": "m", "q": "Which structure is found in prokaryotic cells but not in eukaryotic cells?", "o": ["Nucleoid region", "Mitochondria", "Nuclear envelope", "Golgi apparatus"], "a": 0, "e": "Prokaryotes have naked DNA in a nucleoid; they lack membrane-bound organelles.", "hl": 0, "id": "A2.2-1", "top": "A2.2", "n": 1}, {"t": "m", "q": "Which feature distinguishes plant cells from animal cells?", "o": ["Cellulose cell wall", "80S ribosomes", "Mitochondria", "Plasma membrane"], "a": 0, "e": "Plants also have chloroplasts and a large permanent vacuole; animals have centrioles and no cell wall.", "hl": 0, "id": "A2.2-2", "top": "A2.2", "n": 2}, {"t": "m", "q": "An image of a cell is 50 mm wide. The actual cell is 25 µm wide. What is the magnification?", "o": ["×2000", "×200", "×20 000", "×0.5"], "a": 0, "e": "Convert units: 50 mm = 50 000 µm. Magnification = image ÷ actual = 50 000 ÷ 25 = 2000.", "hl": 0, "id": "A2.2-3", "top": "A2.2", "n": 3}, {"t": "d", "q": "The table compares the features of different types of microscope.", "fig": "<table class=\"dt\"><thead><tr><th>Microscope<\/th><th>Max. resolution<\/th><th>Max. useful magnification<\/th><th>Specimens<\/th><\/tr><\/thead><tbody><tr><td>Light<\/td><td>200 nm<\/td><td>×1500<\/td><td>living or dead<\/td><\/tr><tr><td>Transmission electron<\/td><td>0.1 nm<\/td><td>×1 000 000<\/td><td>dead, thin sections<\/td><\/tr><tr><td>Scanning electron<\/td><td>10 nm<\/td><td>×200 000<\/td><td>dead, surfaces<\/td><\/tr><\/tbody><\/table>", "parts": [{"q": "Calculate how many times better the resolution of the TEM is compared with the light microscope.", "m": 1, "ms": ["200 ÷ 0.1 = 2000 times"]}, {"q": "Explain why a light microscope cannot show ribosomes, even at very high magnification.", "m": 2, "ms": ["Ribosomes are about 20–30 nm, smaller than the light microscope's resolution (200 nm)", "Resolution is limited by the wavelength of light / magnifying more just gives a blurred image"]}, {"q": "Suggest one advantage of using a light microscope rather than an electron microscope.", "m": 1, "ms": ["Living specimens can be viewed / colour / cheaper / easier preparation"]}], "hl": 0, "id": "A2.2-4", "top": "A2.2", "n": 4}], "A2.3": [{"t": "m", "q": "Which feature is shared by all viruses?", "o": ["Genetic material surrounded by a protein capsid", "A lipid envelope", "Ribosomes", "DNA as genetic material"], "a": 0, "e": "Viruses always have a capsid and genetic material (DNA or RNA). Only some have an envelope; none have ribosomes.", "hl": 0, "id": "A2.3-1", "top": "A2.3", "n": 1}, {"t": "m", "q": "Why are viruses not considered to be living cells?", "o": ["They have no metabolism of their own and can only reproduce inside a host cell", "They are too small to see", "They contain RNA", "They do not evolve"], "a": 0, "e": "Viruses lack cytoplasm and enzymes for metabolism; they use the host's machinery.", "hl": 0, "id": "A2.3-2", "top": "A2.3", "n": 2}, {"t": "m", "q": "During the lytic cycle of a bacteriophage, what happens last?", "o": ["The host cell bursts and releases new viruses", "The phage injects its y=\"59.7\" r=\"3.5\" fill=\"#3D55F5\" stroke=\"#2A2A2E\"/><text x=\"302.0\" y=\"290\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#2A2A2E\">time after infection / minutes<\/text><text x=\"16\" y=\"141.0\" text-anchor=\"middle\" font-family=\"Space Mono,monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#2A2A2E\" transform=\"rotate(-90 16 141.0)\">free viruses (thousands)<\/text><\/svg>", "parts": [{"q": "State the time when lysis of host cells began.", "m": 1, "ms": ["Between 30 and 40 minutes"]}, {"q": "Explain the fall in free virus particles in the first 10 minutes.", "m": 1, "ms": ["Viruses attach to / inject into bacteria, so they are no longer free"]}, {"q": "Calculate the mean number of viruses released per original virus (burst size).", "m": 2, "ms": ["2200 ÷ 100 (thousand)", "= 22 viruses per virus (accept 20–22)"]}], "hl": 0, "id": "A2.3-4", "top": "A2.3", "n": 4}], "A3.1": [{"t": "m", "q": "Which definition best describes a species?", "o": ["A group of organisms that can interbreed to produce fertile offspring", "Organisms that look identical", "All organisms living in one habitat", "Organisms that share a genus"], "a": 0, "e": "This is the biological species concept. It has problems for asexual organisms and fossils.", "hl": 0, "id": "A3.1-1", "top": "A3.1", "n": 1}, {"t": "m", "q": "What is the correct way to write the binomial name of the lion?", "o": ["Panthera leo (in italics)", "panthera Leo", "Panthera Leo", "PANTHERA LEO"], "a": 0, "e": "Genus with a capital letter, species epithet lower case, both italicised (or underlined when handwritten).", "hl": 0, "id": "A3.1-2", "top": "A3.1", "n": 2}, {"t": "m", "q": "Horses (2n = 64) and donkeys (2n = 62) can breed to produce mules. Why are mules usually infertile?", "o": ["Chromosomes cannot pair up properly during meiosis", "Mules have no chromosomes", "Mules have too many sex chromosomes", "Mule gametes are produced by mitosis"], "a": 0, function device(){let d=ls.get(DEV);if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());ls.set(DEV,d);}return d;}
async function decrypt(key){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(key.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(LOCK.s),iterations:LOCK.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(LOCK.i)},k,b64(LOCK.c))));}
const MSG={invalid:'✗ That code isn\'t valid. Check for typos and try again.',expired:'Your membership has expired. Renew it on the tutoring page to keep access.',revoked:'This code is no longer active. Please contact us.',devices:'This code is already being used on the maximum number of devices. Contact us if you need it reset.',network:'Couldn\'t check your code. Check your internet connection and try again.',preview:'Preview only: access codes work on the live Tutlix site.'};

const SYNMAP={},PHRASES=[];
SYN_GROUPS.forEach((g,gi)=>g.split('|').forEach(w=>{if(w.includes(' '))PHRASES.push([w,'syn'+gi]);else SYNMAP[w]='syn'+gi;}));
PHRASES.sort((x,y)=>y[0].length-x[0].length);
function prep(t){t=' '+String(t).toLowerCase().replace(/[⁻−–]/g,'-').replace(/°c|℃/g,' degc ').replace(/[^a-zδ0-9.\- ]+/g,' ').replace(/\s+/g,' ')+' ';for(const [ph,id] of PHRASES)t=t.split(' '+ph+' ').join(' '+id+' ');return t;}
function words(t){return prep(t).split(' ').map(w=>w.replace(/^[.\-]+|[.\-]+$/g,'')).filter(Boolean);}
function norm(w){if(/^syn\d+$/.test(w))return w;if(/^-?\d+(\.\d+)?$/.test(w))return 'n'+parseFloat(w);if(SYNMAP[w])return SYNMAP[w];const st=w.replace(/(ies)$/,'y').replace(/(es|s)$/,'');if(SYNMAP[st])return SYNMAP[st];return w.length>6?w.slice(0,6):st;}
function edit1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}return d+(a.length-i)+(b.length-j)<=1;}
function answerOf(t){const ws=words(t);return {set:new Set(ws.map(norm)),raw:ws.filter(w=>w.length>=5&&!/^syn/.test(w))};}
function has(A,term,rawTerm){if(A.set.has(term))return true;if(rawTerm&&rawTerm.length>=5&&!/^syn|^n-?\d/.test(term))return A.raw.some(w=>w[0]===rawTerm[0]&&edit1(w.slice(0,7),rawTerm.slice(0,7)));return false;}
function keyTerms(pt){const out=new Map();words(pt).filter(w=>!STOP.has(w)&&(w.length>2||/\d|^syn/.test(w))).forEach(w=>{const n=norm(w);if(!out.has(n))out.set(n,w);});return [...out.entries()];}
const wt=([n,raw])=>/^n/.test(n)?2:(raw.length>=7&&!/^syn/.test(n))?2:1; /* technical words and numbers count more */
function altsOf(pt){pt=strip(pt).replace(/\b(owtte|ora|ecf)\b/gi,'').replace(/\b(do not accept|reject)\b[^;/]*/gi,'').replace(/\(accept ([^)]*)\)/gi,' / $1');return pt.split(/\s\/\s|;|\bOR\b/).map(x=>x.trim()).filter(x=>x.length>1);}
function pointHit(pt,A){let best=0;for(const alt of altsOf(pt)){let k=keyTerms(alt);if(alt.includes('=')){const nums=keyTerms(alt.split('=').pop()).filter(t=>/^n/.test(t[0]));if(nums.length)k=nums;}if(!k.length)continue;
  const total=k.reduce((s,t)=>s+wt(t),0),got=k.filter(t=>has(A,t[0],t[1])).reduce((s,t)=>s+wt(t),0);
  const need=k.length===1?total:k.length===2?Math.min(total,Math.max(...k.map(wt))+ (k.every(t=>wt(t)===1)?1:0)):total*0.5;
  if(got>=need&&got>0)best=Math.max(best,got/total);}return best;}
function autoCheck(x){const q=x.q,parts=q.t==='s'?[{q:'',m:q.m,ms:q.ms}]:q.parts,texts=x.texts||{},msg=$('#aimsg');
 if(!parts.some((p,pi)=>(texts[pi]||'').trim().length>=3)){if(msg)msg.textContent='Write your answer in the box first, then press Auto-check.';return;}
 x.checks={};x.ai=parts.map((p,pi)=>{const ans=answerOf(texts[pi]||'');
  const hits=p.ms.map((m,mi)=>[mi,pointHit(m,ans)]).filter(h=>h[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,p.m).map(h=>h[0]).sort((a,b)=>a-b);
  hits.forEach(mi=>{x.checks[pi+'-'+mi]=true;});
  const missing=p.ms.length-hits.length,full=hits.length>=p.m;
  return {awarded:hits,score:hits.length,max:p.m,feedback:full?'Great, your answer covers enough markscheme points for full marks.':hits.length?`You included ${hits.length} of the ${p.m} marking points needed.`:'Your answer didn\'t match the markscheme key ideas.',improve:full?'':'Read the unticked points and add those key ideas in your own words.'};});
 x.reveal=true;practice();const t=$('#tot');if(t)t.scrollIntoView({behavior:'smooth',block:'center'});}
function partScores(x){const q=x.q,parts=q.t==='s'?[{m:q.m,ms:q.ms}]:q.parts;return parts.map((p,pi)=>Math.min(p.m,p.ms.filter((_,mi)=>x.checks[pi+'-'+mi]).length));}
function wire(x){const q=x.q;
 if(q.t==='m'){document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{if(x.done&&!S.timed)return;x.sel=+b.dataset.oi;
  if(S.timed){x.score=x.sel===q.a?1:0;record(x);practice();return;}
  x.score=x.sel===q.a?1:0;record(x);if(x.score){S.streak++;S.best=Math.max(S.best,S.streak);}else S.streak=0;practice();}));}
 else{document.querySelectorAll('textarea').forEach(t=>t.addEventListener('input',()=>{x.texts=x.texts||{};x.texts[t.dataset.pi]=t.value;}));
  const rv=$('#rev');if(rv)rv.addEventListener('click',()=>{x.reveal=true;practice();});
  const ab=$('#aibtn');if(ab)ab.addEventListener('click',()=>autoCheck(x));
  const upd=()=>{const ps=partScores(x);ps.forEach((s,pi)=>{const el=document.querySelector(`[data-ps="${pi}"]`);if(el)el.textContent=`${s} / ${(q.t==='s'?q.m:q.parts[pi].m)} marks`;});const tot=$('#tot');if(tot)tot.textContent=`Total: ${ps.reduce((a,b)=>a+b,0)} / ${maxOf(q)}`;};
  document.querySelectorAll('.ms input').forEach(c=>c.addEventListener('change',()=>{x.checks[c.dataset.k]=c.checked;upd();if(x.done){x.score=partScores(x).reduce((a,b)=>a+b,0);record(x);}}));
  const sv=$('#save');if(sv)sv.addEventListener('click',()=>{x.score=partScores(x).reduce((a,b)=>a+b,0);record(x);if(x.score===maxOf(q)){S.streak++;S.best=Math.max(S.best,S.streak);}else S.streak=0;practice();});
  upd();}}
let tmrI=null;
function tick(){clearInterval(tmrI);if(!S||!S.timed||S.finished)return;const el=$('#tmr');const f=()=>{const left=Math.max(0,Math.round((S.end-Date.now())/1000));if(el){el.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;el.classList.toggle('low',left<60);}if(!left){clearInterval(tmrI);finish();}};f();tmrI=setInterval(f,1000);}
function finish(){clearInterval(tmrI);S.finished=true;S.qs.forEach(x=>{if(x.q.t==='m'&&x.sel==null&&!x.done){x.score=0;}});
 const got=S.qs.reduce((s,x)=>s+(x.done?x.score:0),0),mx=S.qs.reduce((s,x)=>s+maxOf(x.q),0),pct=mx?Math.round(got/mx*100):0;
 const grade=pct>=80?['🏆','Excellent!']:pct>=60?['💪','Good work!']:pct>=40?['📚','Getting there.']:['🌱','Keep practising.'];
 app.innerHTML=`<nav class="crumbs"><a href="./#home">Home</a><span>›</span><a href="#">Qbank</a><span>›</span><span>Results</span></nav>
 <section class="card" style="text-align:center;display:grid;gap:8px;justify-items:center;background:${pct>=60?'var(--math)':'var(--bio)'}"><span style="font-size:48px">${grade[0]}</span><div class="big">${pct}%</div><p style="margin:0;font:700 16px var(--mono)">${got} / ${mx} marks · ${grade[1]}</p>${S.best>=3?`<span class="streak">🔥 Best streak: ${S.best}</span>`:''}</section>
 <section class="card"><h2 style="font-size:22px;margin-bottom:10px">Question by question</h2><ul class="rlist">${S.qs.map((x,j)=>{const m=maxOf(x.q),s=x.done?x.score:0,c=s===m?'var(--math)':s>0?'var(--bio)':'var(--phys)';return `<li data-j="${j}"><span class="tag">${j+1}</span><span>${esc(strip(x.q.q).slice(0,90))}${strip(x.q.q).length>90?'…':''}</span><span class="s" style="background:${c}">${x.done?s+'/'+m:'skipped'}</span></li>`;}).join('')}</ul></section>
 <div class="qnav"><a class="btn alt" href="#">← All topics</a><button class="btn" id="again" type="button">Try again</button>${S.qs.some(x=>!x.done||x.score<maxOf(x.q))?'<button class="btn alt" id="wrong" type="button">Redo my mistakes</button>':''}</div>`;
 if(pct>=80)burst();
 document.querySelectorAll('.rlist li').forEach(li=>li.addEventListener('click',()=>{S.finished=false;S.timed=false;S.i=+li.dataset.j;practice();}));
 $('#again').addEventListener('click',()=>{startSession({title:S.title,qs:S.qs.map(x=>x.q),timed:S.timed,back:S.back,more:S.more});practice();});
 const w=$('#wrong');if(w)w.addEventListener('click',()=>{startSession({title:'Redo mistakes',qs:S.qs.filter(x=>!x.done||x.score<maxOf(x.q)).map(x=>x.q)});practice();});
 window.scrollTo({top:0});}
function figText(h){return strip(String(h).replace(/<\/t[dh]>/gi,' | ').replace(/<\/tr>|<br\s*\/?>|<\/p>|<\/li>|<\/text>/gi,'\n')).replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n').trim();}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function burst(){const b=document.createElement('div');b.className='burst';const em=['🎉','⭐','🧬','🔬','✨'];for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=em[i%5];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*0.6+'s';b.appendChild(s);}document.body.appendChild(b);setTimeout(()=>b.remove(),2600);}

/* ---------- routing ---------- */
function route(){clearInterval(tmrI);const h=decodeURIComponent(location.hash.slice(1));window.scrollTo({top:0});
 if(TBY[h]){const t=TBY[h];const qs=qsOf(h);startSession({title:h+' '+t.n,qs,more:t.total-qs.length});if(!qs.length){app.innerHTML=lockBox(t.total);wireLock();return;}practice();return;}
 if(h==='test'&&S){practice();return;}
 if(h==='review'){const all=[];TOPICS.forEach(t=>qsOf(t.c).forEach(q=>{const p=PROG[q.id];if(p&&p.s<p.m)all.push(q);}));if(all.length){startSession({title:'Review my mistakes',qs:all});practice();return;}}
 hub();}
addEventListener('hashchange',route);
tryUnlock().then(route);
})();
</script>

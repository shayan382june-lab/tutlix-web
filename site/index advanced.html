<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutlix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one narrow column of chunky "index cards" on graph paper, like a revision binder. Single light look by choice. */
:root{
  --paper:#F3E6D6; --grid:rgba(42,42,46,.07); --ink:#2A2A2E; --card:#FFFDF8; --muted:#57525C;
  --bio:#FBDF4A; --chem:#3D55F5; --phys:#F25C84; --math:#22D3A5;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,'Courier New',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:680px;margin:0 auto;padding-block:36px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:22px 24px}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--chem);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:18px;text-decoration:none}
.brand h1{font-size:clamp(34px,8vw,44px);font-weight:800;letter-spacing:.5px}
.brand p{margin:2px 0 0;font-family:var(--mono);font-size:14px}
.tap{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;transition:transform .12s,box-shadow .12s}
.tap:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.tap:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.tap h2{font-size:clamp(26px,6vw,32px);font-weight:800;letter-spacing:.5px}
.tap p{margin:4px 0 0;font-family:var(--mono);font-size:14px}
.go{flex:none;width:48px;height:48px;border:3px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;color:var(--ink)}
.bio{background:var(--bio)} .chem{background:var(--chem);color:#fff} .phys{background:var(--phys)} .math{background:var(--math)}
.back{font-family:var(--mono);font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;align-self:flex-start}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-family:var(--mono);font-size:14px}
.crumbs a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs a:hover{text-decoration:underline}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:clamp(40px,11vw,60px);font-weight:800;letter-spacing:.5px}
.hero p{margin:0;font-family:var(--mono);font-size:15px}
.opts{display:grid;gap:16px}
.opt{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;text-decoration:none;transition:transform .12s,box-shadow .12s}
.opt:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.opt .ico{width:56px;height:56px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center}
.opt h2{font-size:24px;font-weight:800}
.opt p{margin:2px 0 0;color:var(--muted);font-size:15px}
.section h2{font-size:24px;font-weight:800;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input{flex:1 1 220px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{font:700 14px var(--mono);border:0;background:transparent;color:var(--ink);padding:0 14px;min-height:44px;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.theme h3{font-size:19px;font-weight:800;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.theme h3 small{font:400 13px var(--mono);color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--card);min-height:52px}
.item .code{font:700 13px var(--mono)}
.item .name{min-width:0}
.hl{font:700 11px var(--mono);border:2px solid var(--ink);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;background:var(--phys)}
.status{font:400 12px var(--mono);color:var(--muted);white-space:nowrap}
.open{font:700 13px var(--mono);text-decoration:none;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;background:var(--bio);box-shadow:2px 2px 0 var(--ink);white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
.empty{font-family:var(--mono);font-size:14px;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border:3px solid var(--ink);border-radius:12px;background:var(--bio);color:var(--ink);font:800 17px var(--display);box-shadow:4px 4px 0 var(--ink);cursor:pointer;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.price{display:flex;flex-wrap:wrap;gap:14px}
.price>div{flex:1 1 170px;border:3px solid var(--ink);border-radius:14px;padding:14px 16px;background:var(--card)}
.price .amt{font-size:34px;font-weight:800;line-height:1;margin-top:4px}
.price .amt small{font:400 14px var(--mono)}
form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
input,select,textarea{font:16px var(--mono);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:90px;resize:vertical}
.note{font-family:var(--mono);font-size:13px;color:var(--muted);margin:0}
.ok{border:3px solid var(--ink);border-radius:12px;background:var(--math);padding:12px 14px;font-weight:700}
footer{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
@media (max-width:440px){.item{grid-template-columns:52px 1fr}.item .end{grid-column:2}.opt{grid-template-columns:48px 1fr}.opt .go{display:none}.opt .ico{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:10px;position:relative}
.plan.best{background:var(--bio)}
.plan .badge{position:absolute;top:-14px;right:16px;font:700 12px var(--mono);background:var(--phys);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.plan .amt{font-size:46px;font-weight:800;line-height:1}.plan .amt small{font:400 15px var(--mono)}
.plan ul{margin:0;padding-left:20px;font-size:15px}.plan li{margin:4px 0}
.cmp{width:100%;border-collapse:collapse;font-size:15px}.cmp th,.cmp td{border-bottom:2px solid #E7DCCB;padding:10px 6px;text-align:left}.cmp th{font:700 12px var(--mono);text-transform:uppercase}.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:90px}
.faq details{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--card);margin-bottom:10px}.faq summary{font-weight:700;cursor:pointer}.faq p{margin:8px 0 0;color:var(--muted)}
.secure{font:13px var(--mono);color:var(--muted);margin:0}
.soon{font:700 11px var(--mono);vertical-align:middle;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;margin-left:8px;letter-spacing:0}
.memb{background:var(--math)}
/* top navigation bar */
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:3px solid var(--ink);box-shadow:0 4px 0 rgba(42,42,46,.12)}
.topbar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px max(16px,env(safe-area-inset-left,0px))}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 24px var(--display);letter-spacing:.5px}
.tb-brand svg{width:40px;height:40px}
.tb-nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.tb-nav a,.tb-nav button.dd{font:700 15px var(--display);text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:10px;border:2px solid transparent;background:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.tb-nav a:hover,.tb-nav button.dd:hover{border-color:var(--ink);background:var(--paper)}
.tb-nav a.on{border-color:var(--ink);background:var(--bio)}
.tb-nav a.cta{background:var(--bio);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);margin-left:6px}
.tb-nav a.cta:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ddwrap{position:relative}
.ddmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:6px;display:none}
.ddwrap.ddopen .ddmenu{display:grid}
.ddmenu a{justify-content:flex-start}
.ddmenu .dot{width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;flex:none}
.tb-burger{display:none;margin-left:auto;width:46px;height:46px;border:3px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);cursor:pointer;place-items:center}
@media (max-width:760px){
 .tb-burger{display:grid}
 .tb-nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;background:var(--card);border-bottom:3px solid var(--ink);padding:10px 16px 16px;gap:4px}
 .topbar.mopen .tb-nav{display:flex}
 .tb-nav a.cta{margin:6px 0 0;justify-content:center}
 .ddmenu{position:static;box-shadow:none;border-width:2px;margin:4px 0 0}
}
/* landing page */
.landing{padding:28px 24px 26px;background:var(--card);position:relative;overflow:hidden}
.landing h1{max-width:560px;font-size:clamp(38px,9vw,58px);font-weight:800;line-height:1.02;margin:8px 0 12px;letter-spacing:.3px}
.landing h1 mark{background:var(--bio);padding:0 6px;border:3px solid var(--ink);border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.landing p.lead{font-family:var(--mono);font-size:15px;margin:0 0 18px;max-width:520px}
.landing .ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn.alt{background:var(--card)}
.landing .blob{position:absolute;right:-56px;top:-56px;width:140px;height:140px;border-radius:50%;background:var(--math);border:3px solid var(--ink);z-index:0}
.landing .blob2{position:absolute;right:92px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--phys);border:3px solid var(--ink)}
.landing>*:not(.blob):not(.blob2){position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:12px 14px;box-shadow:3px 3px 0 var(--ink)}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font:400 12px var(--mono)}
.sechead{font-size:26px;font-weight:800;margin:6px 0 -6px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-decoration:none;transition:transform .12s,box-shadow .12s}.feat:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.feat .ico{width:48px;height:48px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center}
.feat h3{font-size:20px;font-weight:800}
.feat p{margin:0;color:var(--muted);font-size:15px}
.fnav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-bottom:6px}
.fnav a{text-decoration:none;font:700 13px var(--mono)}
.fnav a:hover{text-decoration:underline}
</style>

</head>

function navState(h){const tb=document.getElementById('topbar');if(!tb)return;tb.classList.remove('mopen');document.getElementById('tbBurger').setAttribute('aria-expanded','false');document.getElementById('tbDD').classList.remove('ddopen');
  const sub=h==='pricing'?'pricing':(h.split('-')[1]||'');document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===(sub==='questions'?'qbank':sub)));}
(function(){const tb=document.getElementById('topbar');if(!tb)return;document.getElementById('tbLogo').innerHTML=logo();
  const bg=document.getElementById('tbBurger');bg.addEventListener('click',()=>{const o=tb.classList.toggle('mopen');bg.setAttribute('aria-expanded',String(o));});
  const dd=document.getElementById('tbDD');dd.querySelector('button').addEventListener('click',e=>{e.stopPropagation();const o=dd.classList.toggle('ddopen');e.currentTarget.setAttribute('aria-expanded',String(o));});
  document.addEventListener('click',e=>{if(!dd.contains(e.target))dd.classList.remove('ddopen');});
  tb.querySelectorAll('.tb-nav a').forEach(a=>a.addEventListener('click',()=>{tb.classList.remove('mopen');dd.classList.remove('ddopen');}));})();
function route(){
  const h=(location.hash||'#home').slice(1);navState(h);
  if(h==='pricing'){pricing();window.scrollTo(0,0);return;}
  const [k,sub]=h.split('-');
  if(SUBJECTS[k]){ if(sub==='notes'||sub==='questions') library(k,sub); else if(sub==='tutoring') tutoring(k); else hub(k); }
  else home();
  window.scrollTo(0,0);
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='trialForm') return;
  e.preventDefault();
  const f=e.target, m=document.getElementById('formMsg'), btn=f.querySelector('button[type=submit]');
  if(!/tutlix|netlify/.test(location.hostname)){ m.hidden=false; m.textContent='Preview only. On the live site, this request is sent to your Tutlix inbox.'; return; }
  btn.disabled=true; btn.textContent='Sending…';
  fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f)).toString()})
    .then(r=>{ if(!r.ok) throw new Error(r.status);
      f.querySelectorAll('input:not([type=hidden]),select,textarea,button').forEach(x=>x.closest('.row,label,div:not(#formMsg)')&&(x.disabled=true));
      m.hidden=false; m.textContent='Thanks, your request is in! We will email you within 24 hours with a lesson time and payment details. Check your spam folder if you don\'t see it.';
      btn.textContent='Request sent'; })
    .catch(()=>{ btn.disabled=false; btn.textContent='Request my trial'; m.hidden=false; m.style.background='var(--phys)'; m.textContent='Sorry, that didn\'t send. Check your internet connection and try again.'; });
});
window.addEventListener('hashchange',route);
route();
